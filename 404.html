<!DOCTYPE html>
<html lang="en" data-theme="dark" data-grid="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — ybreakless</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/art/favicon.svg">
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme',
        t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
      if (localStorage.getItem('grid') === 'off') document.documentElement.setAttribute('data-grid', 'off');
    } catch (e) { /* private mode */ }
  })();
</script>
<style>
  /* One screen, centred, sharing the site's tokens rather than restating them. */
  .lost {
    min-height: 100svh;
    display: grid;
    align-content: center;
    gap: var(--s-5);
    max-width: 46rem;
  }
  .lost .code {
    font-family: var(--font-mono);
    font-size: var(--t--1);
    letter-spacing: 0.14em;
    color: var(--fg-subtle);
    text-transform: uppercase;
  }
  .lost .links { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-top: var(--s-2); }
</style>
</head>
<body>
<main class="wrap lost">
  <p class="code">HTTP 404 &middot; no such path</p>
  <h1 style="font-size:var(--t-3)">This page does not exist.</h1>
  <p class="lead">
    Either the address is mistyped or something moved. The site is four pages
    deep at most, so the front page is never far.
  </p>
  <div class="links">
    <a class="btn" href="/">Front page</a>
    <a class="btn btn-ghost" href="/#contact">Contact</a>
    <a class="btn btn-ghost" href="/#console">Console</a>
  </div>
</main>
</body>
</html>
